<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Produto - Controle de Estoque</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <nav class="menu">
      <a href="index.html">Início</a>
      <a href="categoria.html">Categorias</a>
      <a href="fornecedor.html">Fornecedores</a>
      <a href="produto.html">Produtos</a>
      <a href="entrada.html">Entrada de estoque</a>
      <a href="saida.html">Saída de estoque</a>
  </nav>
  <main>
    <h1>Cadastro de Produto</h1>
    <p class="intro">Cadastre cada item que será controlado no estoque, com preços e estoque mínimo.</p>
    <form id="formulario" data-endpoint="php/produto.php" novalidate>
      <label for="sku">Código (SKU)</label>
      <input type="text" id="sku" name="sku" required placeholder="Ex.: CEL-001" >
      <label for="nome">Nome do produto</label>
      <input type="text" id="nome" name="nome" required placeholder="Ex.: Smartphone 128 GB" >
      <label for="categoria">Categoria</label>
      <input type="text" id="categoria" name="categoria" required placeholder="Ex.: Smartphones" >
      <label for="fornecedor">Fornecedor</label>
      <input type="text" id="fornecedor" name="fornecedor" required placeholder="Ex.: Distribuidora Tech Ltda" >
      <label for="preco_custo">Preço de custo (R$)</label>
      <input type="number" id="preco_custo" name="preco_custo" required placeholder="" min="0" step="0.01">
      <label for="preco_venda">Preço de venda (R$)</label>
      <input type="number" id="preco_venda" name="preco_venda" required placeholder="" min="0" step="0.01">
      <label for="estoque_minimo">Estoque mínimo</label>
      <input type="number" id="estoque_minimo" name="estoque_minimo" required placeholder="" min="0">
      <label for="unidade">Unidade</label>
      <select id="unidade" name="unidade" required><option value="">Selecione...</option><option value="un">Unidade</option><option value="cx">Caixa</option><option value="kit">Kit</option></select>
      <button type="submit">Enviar</button>
    </form>
    <div id="mensagem" role="status"></div>
    <p><a class="voltar" href="index.html">&larr; Voltar à página inicial</a></p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
