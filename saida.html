<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saída de Estoque - Controle de Estoque</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <nav class="menu">
      <a href="index.html">Início</a>
      <a href="categoria.html">Categorias</a>
      <a href="fornecedor.html">Fornecedores</a>
      <a href="produto.html">Produtos</a>
      <a href="entrada.html">Entrada de estoque</a>
      <a href="saida.html">Saída de estoque</a>
  </nav>
  <main>
    <h1>Saída de Estoque</h1>
    <p class="intro">Registre a retirada de produtos do estoque, por venda, perda ou devolução ao fornecedor.</p>
    <form id="formulario" data-endpoint="php/saida.php" novalidate>
      <label for="sku">Código (SKU) do produto</label>
      <input type="text" id="sku" name="sku" required placeholder="Ex.: CEL-001" >
      <label for="quantidade">Quantidade retirada</label>
      <input type="number" id="quantidade" name="quantidade" required placeholder="" min="1">
      <label for="estoque_atual">Estoque atual do produto</label>
      <input type="number" id="estoque_atual" name="estoque_atual" required placeholder="" min="0">
      <label for="estoque_minimo">Estoque mínimo do produto</label>
      <input type="number" id="estoque_minimo" name="estoque_minimo" required placeholder="" min="0">
      <label for="motivo">Motivo da saída</label>
      <select id="motivo" name="motivo" required><option value="">Selecione...</option><option value="venda">Venda</option><option value="perda">Perda ou avaria</option><option value="devolucao">Devolução ao fornecedor</option></select>
      <label for="data_saida">Data da saída</label>
      <input type="date" id="data_saida" name="data_saida" required placeholder="" >
      <label for="responsavel">Responsável pela saída</label>
      <input type="text" id="responsavel" name="responsavel" required placeholder="Nome de quem retirou" >
      <button type="submit">Enviar</button>
    </form>
    <div id="mensagem" role="status"></div>
    <p><a class="voltar" href="index.html">&larr; Voltar à página inicial</a></p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
